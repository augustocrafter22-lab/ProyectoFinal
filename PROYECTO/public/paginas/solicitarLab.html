<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="solicitarLab.titulo"></title>
    <link rel="stylesheet" href="../assets/css/global.css">
    <link rel="stylesheet" href="../assets/css/barraNavegacion.css">
    <link rel="stylesheet" href="../assets/css/formularios.css">
</head>

<body class="cargando" data-roles="docente">
    <header class="barraNavegacion">
        <nav>
            <button class="btnMenu" id="btnMenu" type="button">
                <img class="iconoMenu" src="../assets/img/Bootstrap/list.svg" alt="Menú" data-i18n-alt="comun.menu" width="40" height="40">
            </button>

            <button class="btnCerrarMenu" id="btnCerrarMenu" type="button">
                <img class="iconoMenu" src="../assets/img/Bootstrap/x.svg" alt="Cerrar menú" data-i18n-alt="comun.cerrarMenu" width="40" height="40">
            </button>

            <ul class="listaNavegacion">
                <li><a class="btnNavegacion" href="docente.html" data-i18n="comun.regresar"></a></li>
                <li><button class="btnNavegacion cerrarSesion" id="btnCerrarSesion" type="button" data-i18n="comun.cerrarSesion"></button></li>
                <li><button class="btnNavegacion" type="button" data-idioma="es" data-i18n="comun.idiomaEs"></button></li>
                <li><button class="btnNavegacion" type="button" data-idioma="en" data-i18n="comun.idiomaEn"></button></li>
            </ul>
        </nav>

        <h1>S.G.R.S.I</h1>
        <img src="../assets/img/Isotipo-UTU-Color-Dorado-PNG.png" alt="Logo UTU" data-i18n-alt="comun.logoUtu" width="75">
    </header>

    <section class="encabezado">
        <h1 data-i18n="solicitarLab.titulo"></h1>
        <p data-i18n="solicitarLab.subtitulo"></p>
    </section>

    <p id="mensajeSolicitud" class="mensaje" role="status"></p>

    <section class="modulo">
        <form class="formulario" id="formularioSolicitud">
            <label for="laboratorioSolicitud" data-i18n="solicitarLab.labelLaboratorios"></label>
            <select id="laboratorioSolicitud" name="idLaboratorio" required>
                <option value="" data-i18n="solicitarLab.opcionSeleccioneEspacio"></option>
            </select>

            <label for="solicitaSoftware" data-i18n="solicitarLab.labelSolicitudSoftware"></label>
            <select id="solicitaSoftware" name="solicitaSoftware">
                <option value="No" data-i18n="solicitarLab.opcionNo"></option>
                <option value="Si" data-i18n="solicitarLab.opcionSi"></option>
            </select>

            <label for="detalleSoftware" data-i18n="solicitarLab.labelDetalle"></label>
            <textarea id="detalleSoftware" name="detalle" rows="4" minlength="2"></textarea>

            <label for="restricciones" data-i18n="solicitarLab.labelRestricciones"></label>
            <textarea id="restricciones" name="restricciones"></textarea>

            <label for="fechaEstimada" data-i18n="solicitarLab.labelFechaEstimada"></label>
            <input type="date" id="fechaEstimada" name="fechaEstimada" required>

            <label for="horaEstimada" data-i18n="solicitarLab.labelHoraEstimada"></label>
            <input type="time" id="horaEstimada" name="horaEstimada" required>

            <button class="btnPrincipal" type="submit" data-i18n="solicitarLab.btnPublicar"></button>
        </form>
    </section>

    <script src="../assets/js/nucleo/traductor.js"></script>
    <script src="../assets/js/nucleo/api.js"></script>
    <script src="../assets/js/nucleo/sesion.js"></script>
    <script src="../assets/js/nucleo/componentes.js"></script>
    <script src="../assets/js/nucleo/barraNavegacion.js"></script>
    <script src="../assets/js/nucleo/pagina.js"></script>
    <script src="../assets/js/solicitarLab.js"></script>
</body>

</html>
