<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="dashboard.titulo"></title>
    <link rel="stylesheet" href="../assets/css/global.css">
    <link rel="stylesheet" href="../assets/css/barraNavegacion.css">
    <link rel="stylesheet" href="../assets/css/formularios.css">
    <link rel="stylesheet" href="../assets/css/dashboard.css">
</head>

<body class="cargando paginaDashboard" data-roles="coordinador,tecnico">
    <header class="barraNavegacion">
        <nav>
            <button class="btnMenu" id="btnMenu" type="button">
                <img class="iconoMenu" src="../assets/img/Bootstrap/list.svg" alt="Menú" data-i18n-alt="comun.menu" width="40" height="40">
            </button>

            <button class="btnCerrarMenu" id="btnCerrarMenu" type="button">
                <img class="iconoMenu" src="../assets/img/Bootstrap/x.svg" alt="Cerrar menú" data-i18n-alt="comun.cerrarMenu" width="40" height="40">
            </button>

            <ul class="listaNavegacion">
                <li><a class="btnNavegacion" id="enlaceRegresar" href="tecnico.html" data-i18n="comun.regresar"></a></li>
                <li><button class="btnNavegacion cerrarSesion" id="btnCerrarSesion" type="button" data-i18n="comun.cerrarSesion"></button></li>
                <li><button class="btnNavegacion" type="button" data-idioma="es" data-i18n="comun.idiomaEs"></button></li>
                <li><button class="btnNavegacion" type="button" data-idioma="en" data-i18n="comun.idiomaEn"></button></li>
            </ul>
        </nav>

        <h1>S.G.R.S.I</h1>
        <img src="../assets/img/Isotipo-UTU-Color-Dorado-PNG.png" alt="Logo UTU" data-i18n-alt="comun.logoUtu" width="75">
    </header>

    <section class="encabezado">
        <h1 data-i18n="dashboard.titulo"></h1>
        <p data-i18n="dashboard.subtitulo"></p>
    </section>

    <main>
        <section class="seccionEstadisticas">
            <article class="cartaEstadistica">
                <p class="iconoReportes"><img src="../assets/img/Bootstrap/circle-fill.svg" width="12" alt=""></p>
                <p class="cantidadEstadistica" id="cantReportes"></p>
                <p class="etiquetaEstadistica" data-i18n="dashboard.reportes"></p>
            </article>
            <article class="cartaEstadistica">
                <p class="iconoSinAtender"><img src="../assets/img/Bootstrap/circle-fill.svg" width="12" alt=""></p>
                <p class="cantidadEstadistica" id="cantSinAtender"></p>
                <p class="etiquetaEstadistica" data-i18n="dashboard.incidenciasSinAtender"></p>
            </article>
            <article class="cartaEstadistica">
                <p class="iconoEnProceso"><img src="../assets/img/Bootstrap/circle-fill.svg" width="12" alt=""></p>
                <p class="cantidadEstadistica" id="cantEnProceso"></p>
                <p class="etiquetaEstadistica" data-i18n="dashboard.enProceso"></p>
            </article>
            <article class="cartaEstadistica">
                <p class="iconoResueltas"><img src="../assets/img/Bootstrap/circle-fill.svg" width="12" alt=""></p>
                <p class="cantidadEstadistica" id="cantResueltas"></p>
                <p class="etiquetaEstadistica" data-i18n="dashboard.resueltas"></p>
            </article>
        </section>

        <section class="panelGrafico">
            <h2 data-i18n="dashboard.panelIncidenciasPorEstado"></h2>
            <table class="tablaEstados">
                <thead>
                    <tr>
                        <th data-i18n="dashboard.thEstado"></th>
                        <th data-i18n="dashboard.thCantidad"></th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td><span class="etiquetaEstado"><span class="puntoEstado puntoPendiente"></span> <span data-i18n="dashboard.estadoPendiente"></span></span></td>
                        <td id="contadorPendiente"></td>
                    </tr>
                    <tr>
                        <td><span class="etiquetaEstado"><span class="puntoEstado puntoEnProceso"></span> <span data-i18n="dashboard.estadoEnProceso"></span></span></td>
                        <td id="contadorEnProceso"></td>
                    </tr>
                    <tr>
                        <td><span class="etiquetaEstado"><span class="puntoEstado puntoResuelto"></span> <span data-i18n="dashboard.estadoResuelto"></span></span></td>
                        <td id="contadorResuelto"></td>
                    </tr>
                    <tr>
                        <td><span class="etiquetaEstado"><span class="puntoEstado puntoCerrado"></span> <span data-i18n="dashboard.estadoCerrado"></span></span></td>
                        <td id="contadorCerrado"></td>
                    </tr>
                </tbody>
                <tfoot>
                    <tr>
                        <td data-i18n="dashboard.total"></td>
                        <td id="contadorTotal"></td>
                    </tr>
                </tfoot>
            </table>
        </section>

        <section class="panelGrafico">
            <h2 data-i18n="dashboard.panelTiempos"></h2>
            <table class="tablaEstados">
                <thead>
                    <tr>
                        <th data-i18n="dashboard.thTicket"></th>
                        <th data-i18n="dashboard.thDias"></th>
                    </tr>
                </thead>
                <tbody id="cuerpoTiempos"></tbody>
            </table>
        </section>

        <section class="panelGrafico">
            <h2 data-i18n="dashboard.panelIncidenciasPorSalon"></h2>
            <table class="tablaEstados">
                <thead>
                    <tr>
                        <th data-i18n="dashboard.thSalon"></th>
                        <th data-i18n="dashboard.thIncidencias"></th>
                    </tr>
                </thead>
                <tbody id="cuerpoSalones"></tbody>
            </table>
        </section>
    </main>

    <script src="../assets/js/nucleo/traductor.js"></script>
    <script src="../assets/js/nucleo/api.js"></script>
    <script src="../assets/js/nucleo/sesion.js"></script>
    <script src="../assets/js/nucleo/componentes.js"></script>
    <script src="../assets/js/nucleo/barraNavegacion.js"></script>
    <script src="../assets/js/nucleo/pagina.js"></script>
    <script src="../assets/js/dashboard.js"></script>
</body>

</html>
